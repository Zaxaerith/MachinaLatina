name: Python conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute repository tests
        run: python -m unittest discover -s tests -v
      - name: Check the real four-job cross-machine input deck
        run: |
          python -m ordo_operum run examples/input_roundtrip.ord --out-dir build/input-ci
          python -m ordo_operum inspect build/input-ci/PROBA.omr
